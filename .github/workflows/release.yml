name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from fxmanifest
        id: version
        run: |
          VERSION=$(grep -oP "^version\s+'\K[^']+" fxmanifest.lua)

          if [ -z "$VERSION" ]; then
            echo "::error::No version found in fxmanifest.lua"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage release files
        run: |
          STAGE_DIR="release-stage/ps-dispatch"
          mkdir -p "$STAGE_DIR"

          cp -r client "$STAGE_DIR/"
          cp -r server "$STAGE_DIR/"
          cp -r shared "$STAGE_DIR/"
          cp -r locales "$STAGE_DIR/"
          cp -r html "$STAGE_DIR/"
          cp fxmanifest.lua "$STAGE_DIR/"

          for item in sounds LICENSE README.md SECURITY.md; do
            [ -e "$item" ] && cp -r "$item" "$STAGE_DIR/"
          done

      - name: Create archive
        id: archive
        run: |
          ARCHIVE="ps-dispatch-${{ steps.version.outputs.tag }}.zip"
          (cd release-stage && zip -qr "../$ARCHIVE" ps-dispatch)
          echo "name=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: true
          files: ${{ steps.archive.outputs.name }}
